name: Cross-Platform Test Runners (Linux & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - jules

jobs:
  linux-runner:
    name: Linux Runner (Ubuntu Xvfb + AT-SPI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Provision GUI Environment, Cua Driver & Run Autonomous Test Suite
        env:
          CLOUDFLARE_HUB_URL: "https://jev-crossplatform-hub.kashyapv2.workers.dev"
          CLOUDFLARE_RUNNER_KEY: "dev-secret-key"
          RUNNER_ID: "github-actions-ubuntu"
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          chmod +x startup_jules.sh
          ./startup_jules.sh
          
          # Source the complete runtime environment created by startup_jules.sh
          if [[ -f "${HOME}/.jules_env" ]]; then
            source "${HOME}/.jules_env"
          fi
          
          uv run python python/run_jules_suite.py --provider live --report-dir reports --runner-id github-actions-ubuntu

      - name: Upload Linux Evaluation Artifacts & Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-evaluation-reports
          path: |
            reports/
            runs/

  windows-runner:
    name: Windows Runner (Windows Server UI Automation)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Cua Driver on Windows
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://cua.ai/driver/install.ps1" -OutFile "$env:TEMP\install.ps1"
          & "$env:TEMP\install.ps1" -ErrorAction SilentlyContinue
          $env:Path += ";$env:USERPROFILE\.local\bin"
          Write-Output "Cua Driver installed."

      - name: Run Windows Test Suite
        shell: bash
        env:
          CLOUDFLARE_HUB_URL: "https://jev-crossplatform-hub.kashyapv2.workers.dev"
          CLOUDFLARE_RUNNER_KEY: "dev-secret-key"
          RUNNER_ID: "github-actions-windows"
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          export PATH="$USERPROFILE/.local/bin:$PATH"
          uv run python python/run_jules_suite.py --provider live --report-dir reports --runner-id github-actions-windows

      - name: Upload Windows Evaluation Artifacts & Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evaluation-reports
          path: |
            reports/
            runs/
